# CircleCI 2.1 configuration for ScrapydWeb.
#
# This file is intentionally thin: every install / scrapyd / test / report
# step is delegated to the shared ./test.sh entrypoint (the same one used by
# GitHub Actions and local runs). Jobs only declare the docker images and
# the variant environment variables.
#
# The matrix-check job runs ci/check_matrix.py to guarantee that this
# workflow and .github/workflows/tests.yml keep covering all required
# combos (see ci/README.md).
version: 2.1

orbs:
  codecov: codecov/codecov@1.0.2

commands:
  scrapydweb-test:
    description: Shared install/start/test/report pipeline driven by ./test.sh
    steps:
      - checkout
      - run:
          name: Load environment variant
          command: ./test.sh env "${DB_VARIANT:-none}" >> $BASH_ENV
      - run:
          name: Install dependencies
          command: ./test.sh install
      - run:
          name: Wait for database
          command: ./test.sh wait-db
      - run:
          name: Launch Scrapyd
          command: ./test.sh scrapyd
      - run:
          name: Run tests
          command: ./test.sh test
      - run:
          name: Generate report
          command: ./test.sh report
          when: always
      - run:
          name: Allure report
          command: ./test.sh allure
          when: always
      - store_artifacts:
          path: htmlcov
      - store_artifacts:
          path: coverage.xml
      - store_artifacts:
          path: allure-report
      - codecov/upload:
          file: coverage.xml

jobs:
  matrix-check:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Validate CI matrix coverage
          command: ./test.sh check

  py:
    description: Base test run on a single Python version
    parameters:
      version:
        type: string
    docker:
      - image: cimg/python:<<parameters.version>>
    environment:
      DB_VARIANT: none
    steps:
      - scrapydweb-test

  py-scrapyd-v143:
    description: Test run pinned to scrapyd==1.4.3
    parameters:
      version:
        type: string
    docker:
      - image: cimg/python:<<parameters.version>>
    environment:
      DB_VARIANT: none
      SCRAPYD_VERSION: "1.4.3"
    steps:
      - scrapydweb-test

  py-sqlite:
    description: Test run against SQLite with custom DATA_PATH/DATABASE_URL
    parameters:
      version:
        type: string
      use-git:
        type: enum
        enum: ["", "1"]
        default: ""
    docker:
      - image: cimg/python:<<parameters.version>>
    environment:
      DB_VARIANT: sqlite
      USE_GIT: <<parameters.use-git>>
    steps:
      - scrapydweb-test

  py-postgresql:
    description: Test run against PostgreSQL
    parameters:
      version:
        type: string
      use-git:
        type: enum
        enum: ["", "1"]
        default: ""
      allure-version:
        type: string
        default: ""
    docker:
      - image: cimg/python:<<parameters.version>>
      - image: cimg/postgres:9.6
        environment:
          POSTGRES_USER: circleci
          POSTGRES_DB: circleci
          POSTGRES_PASSWORD: passw0rd
    environment:
      DB_VARIANT: postgresql
      USE_GIT: <<parameters.use-git>>
      ALLURE_VERSION: <<parameters.allure-version>>
    steps:
      - scrapydweb-test

  py-mysql:
    description: Test run against MySQL
    parameters:
      version:
        type: string
      use-git:
        type: enum
        enum: ["", "1"]
        default: ""
    docker:
      - image: cimg/python:<<parameters.version>>
      - image: cimg/mysql:5.7
        environment:
          MYSQL_ROOT_PASSWORD: rootpw
    environment:
      DB_VARIANT: mysql
      USE_GIT: <<parameters.use-git>>
    steps:
      - scrapydweb-test

workflows:
  test:
    jobs:
      - matrix-check
      - py:
          name: py38
          version: "3.8"
      - py:
          name: py39
          version: "3.9"
      - py:
          name: py310
          version: "3.10"
      - py:
          name: py311
          version: "3.11"
      - py:
          name: py312
          version: "3.12"
      - py:
          name: py313
          version: "3.13"
      - py-scrapyd-v143:
          name: py39-scrapyd-v143
          version: "3.9"
      - py-scrapyd-v143:
          name: py312-scrapyd-v143
          version: "3.12"
      - py-sqlite:
          name: py310-sqlite
          version: "3.10"
      - py-postgresql:
          name: py310-postgresql
          version: "3.10"
      - py-mysql:
          name: py310-mysql
          version: "3.10"
      - py-postgresql:
          name: py310-git-postgresql
          version: "3.10"
          use-git: "1"
          allure-version: "2.13.1"
      - py-mysql:
          name: py310-git-mysql
          version: "3.10"
          use-git: "1"
