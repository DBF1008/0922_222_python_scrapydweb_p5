# CircleCI 2.1 configuration.
#
# This config is intentionally thin: all install / Scrapyd-launch / test
# logic lives in the reusable entry points (test.sh and scripts/ci/*.sh),
# shared with the GitHub Actions workflow (.github/workflows/tests.yml).
# scripts/ci/check_matrix.py guards the matrix against missing combinations.
version: 2.1

orbs:
  codecov: codecov/codecov@1.0.2

jobs:
  test:
    parameters:
      python:
        type: string
      use-git:
        type: string
        default: ""
      scrapyd-version:
        type: string
        default: ""
      database-url:
        type: string
        default: ""
      data-path:
        type: string
        default: ""
    docker:
      - image: cimg/python:<< parameters.python >>
      # Both database sidecars are always defined (CircleCI docker images
      # cannot be conditional); legs that do not need them ignore them.
      - image: cimg/postgres:9.6
        environment:
          POSTGRES_USER: circleci
          POSTGRES_DB: circleci
          POSTGRES_PASSWORD: passw0rd
      - image: cimg/mysql:5.7
        environment:
          MYSQL_ROOT_PASSWORD: rootpw
    environment:
      SCRAPYDWEB_TESTMODE: "True"
      USE_GIT: << parameters.use-git >>
      SCRAPYD_VERSION: << parameters.scrapyd-version >>
      DATABASE_URL: << parameters.database-url >>
      DATA_PATH: << parameters.data-path >>
    working_directory: ~/repo
    steps:
      - checkout
      - run:
          name: Install system packages
          command: sudo apt-get update && sudo apt-get install -y telnet
      - run:
          name: Install, launch Scrapyd and run tests
          command: ./test.sh
      - run:
          name: Upload coverage to Coveralls
          command: |
            . venv/bin/activate
            coveralls || echo 'coveralls upload failed, ignoring'
          when: always
      - store_artifacts:
          path: htmlcov
      - store_artifacts:
          path: coverage.xml
      - store_artifacts:
          path: allure-results
      - codecov/upload:
          file: coverage.xml

workflows:
  test:
    jobs:
      # Base tests across supported Python versions.
      - test:
          name: py<< matrix.python >>
          matrix:
            parameters:
              python: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
      # Legacy Scrapyd pin on the oldest/newest maintained lines.
      - test:
          name: py<< matrix.python >>-scrapyd-v143
          matrix:
            parameters:
              python: ["3.9", "3.12"]
              scrapyd-version: ["1.4.3"]
      # Optional git-master dependencies.
      - test:
          name: py310-git-postgresql
          python: "3.10"
          use-git: "1"
          database-url: "postgresql://circleci:passw0rd@localhost:5432/circleci"
      - test:
          name: py310-git-mysql
          python: "3.10"
          use-git: "1"
          database-url: "mysql://root:rootpw@127.0.0.1:3306"
      # Database variants.
      - test:
          name: py310-sqlite
          python: "3.10"
          data-path: "/home/circleci/repo/scrapydweb_data"
          database-url: "sqlite:////home/circleci/repo/scrapydweb_database"
      - test:
          name: py310-postgresql
          python: "3.10"
          database-url: "postgresql://circleci:passw0rd@localhost:5432/circleci"
      - test:
          name: py310-mysql
          python: "3.10"
          database-url: "mysql://root:rootpw@127.0.0.1:3306"
